services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - N8N_SECURE_COOKIE=false
    volumes:
      - ../n8n/n8n_data:/home/node/.n8n
    networks:
      - quizzcards

  database:
    container_name: mongodb_quizzcards
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: quizzcards
      MONGO_INITDB_ROOT_PASSWORD: KHmb#2494QuizzCards
    volumes:
      - the-quizz-cards_mongo-data:/data/db
    networks:
      - quizzcards

  frontend:
    container_name: front_quizzcards
    image: snkhadim/quizzcards-frontend
    ports:
      - "80:80"
      - "443:443"
    networks:
      - quizzcards
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    container_name: back_quizzcards
    image: snkhadim/quizzcards-backend
    ports:
      - "9000:9000"
    networks:
      - quizzcards
    depends_on:
      - database
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - IP_HOST=quizzcards.info
      - CALL_BACK_URL=http://quizzcards.info:9000/login/oauth2/code/google
    restart: unless-stopped

networks:
  quizzcards:
    driver: bridge

volumes:
  the-quizz-cards_mongo-data:
    external: true