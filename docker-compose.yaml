services:
  database:
    image: mongo:7.0
    container_name: mongodb_quizzcards
    environment:
      MONGO_INITDB_ROOT_USERNAME: quizzcards
      MONGO_INITDB_ROOT_PASSWORD: KHmb#2494QuizzCards
    volumes:
      - mongo-data:/data/db
    networks:
      - quizzcards

  frontend:
    container_name: front_quizzcards
    build:
      context: ./quizzcards
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - quizzcards
    depends_on:
      - backend
    restart: unless-stopped
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    container_name: certbot_quizzcards
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    #entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  backend:
    container_name: back_quizzcards
    build:
      context: ./backSpringBoot
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    networks:
      - quizzcards
    depends_on:
      - database
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - IP_HOST=quizzcards.info
      - CALL_BACK_URL=http://quizzcards.info:9000/login/oauth2/code/google
    env_file:
      - .env
    restart: unless-stopped

networks:
  quizzcards:
    driver: bridge

volumes:
  mongo-data: