<div class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-gray-900 mb-2">Modifier votre QuizzCard</h1>
      <p class="text-gray-600">Modifiez les informations de votre carte</p>
    </div>

    <!-- Form and Preview -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <!-- Form Card -->
      <div class="bg-white rounded-2xl shadow-xl p-6 lg:p-8">
        <form [formGroup]="quizzForm" class="space-y-6">
          <!-- Domain and Difficulty Row -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Domain -->
            <div>
              <label for="domaine" class="block text-sm font-medium text-gray-700 mb-2">
                Domaine <span class="text-red-500">*</span>
              </label>
              <select 
                id="domaine"
                name="domaine" 
                formControlName="domaine"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                <option value="science et technologie">Science et technologie</option>
                <option value="geographie">Géographie</option>
                <option value="medecine">Médecine</option>
                <option value="botanique">Botanique</option>
                <option value="histoire">Histoire</option>
                <option value="zoo">Animale</option>
                <option value="litterature" >Littérature</option>
                <option value="generale" >Culture Générale</option>
              </select>
            </div>

            <!-- Difficulty -->
            <div>
              <label for="difficulte" class="block text-sm font-medium text-gray-700 mb-2">
                Difficulté <span class="text-red-500">*</span>
              </label>
              <select 
                id="categorie"
                name="difficulté" 
                formControlName="difficulte"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                <option value="facile">Facile</option>
                <option value="moyenne">Moyenne</option>
                <option value="difficile">Difficile</option>
                <option value="expert">Expert</option>
                <option value="génie">Génie</option>
              </select>
            </div>
          </div>

          <!-- Question -->
          <div>
            <label for="question" class="block text-sm font-medium text-gray-700 mb-2">
              Question <span class="text-red-500">*</span>
            </label>
            <textarea 
              id="question"
              name="question" 
              rows="3"
              formControlName="question"
              placeholder="Saisissez votre question..."
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors resize-none"></textarea>
          </div>

          <!-- Answer -->
          <div>
            <label for="reponse" class="block text-sm font-medium text-gray-700 mb-2">
              Réponse <span class="text-red-500">*</span>
            </label>
            <textarea 
              id="reponse"
              name="reponse" 
              rows="2"
              formControlName="reponse"
              placeholder="Saisissez la réponse..."
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors resize-none"></textarea>
          </div>

          <!-- Explanation -->
          <div>
            <label for="explication" class="block text-sm font-medium text-gray-700 mb-2">
              Explication <span class="text-gray-400 text-xs">(optionnelle)</span>
            </label>
            <textarea 
              id="explication"
              name="explication" 
              rows="4"
              formControlName="explication"
              placeholder="Ajoutez une explication détaillée (optionnelle)..."
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors resize-none"></textarea>
          </div>

          <!-- Submit Button -->
          <button 
            type="submit"
            (click)="onSubmitForm()" 
            [disabled]="quizzForm.invalid"
            class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors shadow-md hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">
            Enregistrer les modifications
          </button>
        </form>
      </div>

      <!-- Preview Card -->
      <div class="flex justify-center lg:justify-start">
        <div class="sticky top-24" >
          <div class="bg-white rounded-2xl shadow-xl p-6">
            <h3 class="text-xl font-bold text-gray-800 mb-4 text-center">Aperçu</h3>
            <app-quizz-card [quizzCard]="card"/>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
