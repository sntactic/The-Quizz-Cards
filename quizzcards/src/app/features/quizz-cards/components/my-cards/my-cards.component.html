<div class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-7xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Mes Cartes</h1>
    
    <!-- Empty State -->
    <div *ngIf="quizzCards.length === 0" class="text-center py-20 bg-white rounded-xl shadow-lg">
      <div class="text-6xl mb-4">📝</div>
      <h2 class="text-2xl font-semibold text-gray-700 mb-2">Vous n'avez aucune carte !</h2>
      <p class="text-gray-500 mb-6">Commencez par créer votre première carte de quiz</p>
      <a
        routerLink="/createcard"
        class="inline-block px-6 py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-lg font-medium transition-colors shadow-md">
        Créer une carte
      </a>
    </div>
    
    <!-- Cards Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" *ngIf="quizzCards.length > 0">
      @for (quizzCard of quizzCards; track $index) {
        <app-quizz-card appAnimateOnVisible="animate-fade-in" [quizzCard]="quizzCard" />
      }
    </div>
  </div>
</div>
