
services:
  database:
    image: mongo:7.0
    container_name: mongodb_quizzcards
    environment:
      MONGO_INITDB_ROOT_USERNAME: quizzcards
      MONGO_INITDB_ROOT_PASSWORD: KHmb#2494QuizzCards
    volumes:
      - mongo-data:/data/db
    networks:
      - quizzcards

  frontend:
    container_name: front_quizzcards
    build:
      context: ./newfront
      dockerfile: Dockerfile
    ports:
      - "80:80"
      #- "443:443"
    networks:
      - quizzcards
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    container_name: back_quizzcards
    build:
      context: ./backSpringBoot
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    networks:
      - quizzcards
    depends_on:
      - database
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    restart: unless-stopped

networks:
  quizzcards:
    driver: bridge

volumes:
  mongo-data: