<aside 
  class="fixed top-16 left-0 h-[calc(100vh-4rem)] w-64 bg-gradient-to-b from-blue-600 to-red-600 transform transition-transform duration-300 ease-in-out z-40 shadow-2xl"
  [class.translate-x-0]="side_bar"
  [class.-translate-x-full]="!side_bar">
  
  <nav class="flex flex-col h-full pt-8 px-4 space-y-4">
    <!-- Navigation Links -->
    <a 
      routerLink="quizzcards" 
      routerLinkActive="bg-white/20 shadow-lg scale-105"
      [routerLinkActiveOptions]="{exact:true}"
      class="px-4 py-3 text-white font-medium rounded-lg hover:bg-white/10 transition-all duration-200 flex items-center space-x-2">
      <span>📚</span>
      <span>QuizzCards</span>
    </a>

    <a 
      routerLink="createcard" 
      routerLinkActive="bg-white/20 shadow-lg scale-105"
      [routerLinkActiveOptions]="{exact:true}"
      class="px-4 py-3 text-white font-medium rounded-lg hover:bg-white/10 transition-all duration-200 flex items-center space-x-2">
      <span>➕</span>
      <span>Créer une carte</span>
    </a>

    <a 
      routerLink="mycards" 
      routerLinkActive="bg-white/20 shadow-lg scale-105"
      [routerLinkActiveOptions]="{exact:true}"
      class="px-4 py-3 text-white font-medium rounded-lg hover:bg-white/10 transition-all duration-200 flex items-center space-x-2">
      <span>📋</span>
      <span>Mes cartes</span>
    </a>

    <!-- Auth Section -->
    <div class="mt-auto pb-8 space-y-3" *ngIf="auth.isAuth === false">
      <a 
        routerLink="sign/in" 
        routerLinkActive="bg-green-600"
        [routerLinkActiveOptions]="{exact:true}"
        class="block px-4 py-3 bg-green-500 hover:bg-green-600 text-white font-medium rounded-lg text-center transition-colors shadow-md">
        Se connecter
      </a>
      <a 
        routerLink="sign/up" 
        routerLinkActive="bg-blue-600"
        [routerLinkActiveOptions]="{exact:true}"
        class="block px-4 py-3 bg-blue-500 hover:bg-blue-600 text-white font-medium rounded-lg text-center transition-colors shadow-md">
        S'inscrire
      </a>
    </div>

    <!-- Logout Button -->
    <button 
      *ngIf="auth.isAuth === true"
      (click)="auth.onDisonnected()" 
      class="mt-auto mb-8 px-4 py-3 bg-red-500 hover:bg-red-600 text-white font-medium rounded-lg w-full transition-colors shadow-md">
      Déconnecter
    </button>
  </nav>
</aside>
