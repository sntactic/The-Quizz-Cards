<nav class="fixed top-0 left-0 right-0 z-50 bg-gradient-to-r from-blue-600 to-blue-800 shadow-lg">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Logo and Title -->
      <div class="flex items-center space-x-3 flex-shrink-0">
        <a routerLink="" class="flex items-center space-x-3 hover:opacity-80 transition-opacity">
          <img class="h-10 w-10 rounded-lg object-cover" src="assets/app_logo.jpeg" alt="Logo"/>
          <span class="text-white font-bold text-lg hidden sm:block">The Quizz Cards</span>
        </a>
      </div>

      <!-- Mobile Menu Button -->
      <button 
        *ngIf="route.url !== '/'"
        (click)="onClique()"
        class="md:hidden p-2 rounded-md text-white hover:bg-blue-700 transition-colors"
        aria-label="Toggle menu">
        <img class="h-6 w-6" [src]="img_menue" alt="Menu"/>
      </button>

      <!-- Desktop Auth Buttons -->
      <div class="hidden md:flex items-center space-x-3">
        <ng-container *ngIf="auth.isAuth === false">
          <a 
            mat-button 
            routerLink="sign/in" 
            routerLinkActive="bg-green-600"
            [routerLinkActiveOptions]="{exact:true}"
            class="px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg font-medium transition-colors shadow-md hover:shadow-lg">
            Se connecter
          </a>
          <a 
            mat-button 
            routerLink="sign/up" 
            routerLinkActive="bg-blue-600"
            [routerLinkActiveOptions]="{exact:true}"
            class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg font-medium transition-colors shadow-md hover:shadow-lg">
            S'inscrire
          </a>
        </ng-container>

        <ng-container *ngIf="auth.isAuth === true">
          <div class="flex items-center space-x-3">
            <span class="text-white text-sm">{{auth.user?.name}}</span>
            <button 
              (click)="onDisconnect()" 
              class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg font-medium transition-colors shadow-md hover:shadow-lg">
              Déconnecter
            </button>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</nav>
