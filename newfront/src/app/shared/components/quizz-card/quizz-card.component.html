<div class="flip" [class.is-flipped]="fliped" >
  <div class="flipper" >
    <!-- Front of Card -->
    <div style="height: 70vh;"
      *ngIf="fliped === false"
      [class.border-green-500]="quizzCard.couleur === 'green'"
      [class.border-yellow-500]="quizzCard.couleur === 'yellow'"
      [class.border-blue-500]="quizzCard.couleur === 'blue'"
      [class.border-red-500]="quizzCard.couleur === 'red'"
      [class.border-purple-500]="quizzCard.couleur === 'purple'"
      [style.border-width]="'3px'"
      class="bg-white rounded-xl shadow-lg hover:shadow-2xl transition-shadow flex flex-col text-center p-6 m-4">
      
      <!-- Domain Badge -->
      <div class="text-xl font-serif mb-2 text-gray-700">{{quizzCard.domaine}}</div>
      
      <!-- Action Buttons -->
      <div class="flex justify-center mb-2">
        <button
          (click)="quizzCard.onVoirReponse()"
          class="px-4 py-1 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm font-medium text-gray-700 border border-gray-300 transition-colors">
          {{quizzCard.etat_repone}}
        </button>
      </div>
      
      <!-- Category Badge -->
      <p 
        [class.bg-green-500]="quizzCard.couleur === 'green'"
        [class.bg-yellow-500]="quizzCard.couleur === 'yellow'"
        [class.bg-blue-500]="quizzCard.couleur === 'blue'"
        [class.bg-red-500]="quizzCard.couleur === 'red'"
        [class.bg-purple-500]="quizzCard.couleur === 'purple'"
        class="inline-block px-3 py-1 rounded-full text-white text-sm font-semibold mb-3">
        {{quizzCard.categorie}}
      </p>
      
      <!-- Image -->
      <img 
        [src]="quizzCard.imageUrl" 
        [alt]="quizzCard.domaine" 
        (click)="onfliped()"
        class="w-full h-48 object-cover rounded-lg mb-4 cursor-pointer hover:opacity-90 transition-opacity"/>
      
      <!-- Question -->
      <div class="text-base font-semibold mb-4 text-gray-800 min-h-[3rem] flex flex-col items-center justify-center">
        <p class="text-center mb-2">{{ isQuestionLong? question : quizzCard.question }}
          <button 
            *ngIf="isQuestionLong"
            type="button"
            (click)="openDialog(quizzCard.question , $event)"
            (mousedown)="$event.stopPropagation()"
            class="text-2xl text-blue-500 hover:text-blue-600 font-normal mt-1 transition-colors cursor-pointer z-10 relative">
            ...<span class="text-xs">plus</span>
          </button>
        </p>
      </div>
      
      <!-- Answer -->
      <div class="mb-4">
        @if (quizzCard.reponse_vue === true) {
          <p class="text-green-600 font-medium text-base">{{isAnswerLong? answer : quizzCard.reponse}}
            <button 
              *ngIf="isAnswerLong"
              type="button"
              (click)="openDialog(quizzCard.reponse , $event)"
              (mousedown)="$event.stopPropagation()"
              class="text-2xl text-blue-500 hover:text-blue-600 font-normal mt-1 transition-colors cursor-pointer z-10 relative">
              ...<span class="text-xs">plus</span>
            </button>
          </p>
        } @else {
          <p class="text-gray-400 text-lg font-semibold">???</p>
        }
      </div>
      
      <!-- Footer -->
      <div class="mt-auto flex items-center justify-between text-xs text-gray-500 pt-4 border-t">
        <div>{{quizzCard.date | date:'d MMMM YYYY à HH:mm'}}</div>
        <button 
          *ngIf="route.url==='/mycards' || (route.url==='/adminpage' && isAdmin)"
          [class.bg-green-600]="quizzCard.publication ==='publique'"
          [class.bg-red-500]="quizzCard.publication ==='privee'"
          (click)="onPublier()"
          class="px-3 py-1 text-white rounded-full text-xs font-semibold hover:opacity-80 transition-opacity capitalize">
          {{quizzCard.publication}}
        </button>
      </div>
    </div>

    <!-- Back of Card -->
    <div style="height: 70vh;"
      *ngIf="fliped === true"
      class="quizz-card-back"
      [class.border-green-500]="quizzCard.couleur === 'green'"
      [class.border-yellow-500]="quizzCard.couleur === 'yellow'"
      [class.border-blue-500]="quizzCard.couleur === 'blue'"
      [class.border-red-500]="quizzCard.couleur === 'red'"
      [class.border-purple-500]="quizzCard.couleur === 'purple'"
      [style.border-width]="'3px'"
      class="bg-white rounded-xl shadow-lg hover:shadow-2xl transition-shadow flex flex-col text-center p-6 m-4"
      (click)="onfliped()">
      
      <!-- Header with Actions -->
      <div class="flex justify-between items-start mb-4">
        <h1 class="text-2xl font-bold text-gray-800">Explication</h1>
        <div class="flex space-x-2" *ngIf="route.url==='/mycards' || (route.url==='/adminpage' && isAdmin)">
          <button 
            (click)="onEdit(); $event.stopPropagation()"
            class="p-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg transition-colors shadow-md"
            title="Modifier">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
            </svg>
          </button>
          <button 
            (click)="onDelete(); $event.stopPropagation()"
            class="p-2 bg-red-500 hover:bg-red-600 text-white rounded-lg transition-colors shadow-md"
            title="Supprimer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
          </button>
        </div>
      </div>
      
      <!-- Explanation -->
      <div class="flex-1 flex items-center justify-center">
        <h4 class="text-gray-700 text-lg leading-relaxed">{{quizzCard.explication}}</h4>
      </div>
    </div>
  </div>
</div>
